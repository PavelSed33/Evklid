name: Check Evklid
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evklid-screenshots
          path: screenshots
          if-no-files-found: ignore
